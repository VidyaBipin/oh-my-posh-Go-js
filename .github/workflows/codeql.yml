on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'website/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main

name: Code QL
jobs:
  code-ql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        languages: go
    - name: Autobuild
      uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
