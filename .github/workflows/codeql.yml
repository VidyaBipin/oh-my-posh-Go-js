on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'website/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main

name: Code QL
jobs:
  code-ql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    - name: Initialize CodeQL
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
      with:
        languages: go
    - name: Autobuild
      uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
